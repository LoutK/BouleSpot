name: Import worldwide boule spots

on:
  workflow_dispatch:
    inputs:
      max_tiles:
        description: "Total number of 10-degree land tiles to process (recommended: 50)"
        required: true
        default: "50"
        type: string

permissions:
  contents: write

concurrency:
  group: worldwide-boule-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests shapely

      - name: Import strict OpenStreetMap boule pitches
        env:
          SUPABASE_URL: https://wcowekncesjckmooacyf.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          remaining="${{ inputs.max_tiles }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while [ "$remaining" -gt 0 ]; do
            chunk=5
            if [ "$remaining" -lt "$chunk" ]; then
              chunk="$remaining"
            fi

            python scripts/import_worldwide_boule_spots.py \
              --state-path data/worldwide-import-state.json \
              --max-tiles "$chunk" \
              --supabase-url "$SUPABASE_URL" \
              --supabase-key "$SUPABASE_KEY"

            git add data/worldwide-import-state.json
            git commit -m "chore: update worldwide import progress"
            git push
            remaining=$((remaining - chunk))
          done
